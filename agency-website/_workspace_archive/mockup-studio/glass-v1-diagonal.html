<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V1 — Diagonal Fluted | About Mark Bishop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{background:#050510;color:#f0f4f8;font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
    .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");mix-blend-mode:overlay}
    .content{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 5%}
    .badge{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:#00d4ff;letter-spacing:3px;text-transform:uppercase;margin-bottom:16px}
    .badge a{color:#00d4ff;text-decoration:none;border:1px solid rgba(0,212,255,.3);padding:6px 14px;border-radius:20px;margin-right:12px;transition:.3s}
    .badge a:hover{background:rgba(0,212,255,.15)}
    h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(3rem,6vw,5.5rem);font-weight:900;letter-spacing:-2px;text-align:center;line-height:1.05;margin-bottom:20px;text-shadow:0 10px 30px rgba(0,0,0,0.5)}
    h1 em{font-style:normal;background:linear-gradient(135deg,#00d4ff,#b8ff57);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{color:#b0c0d8;font-size:1.25rem;max-width:650px;text-align:center;line-height:1.65;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="grain"></div>
  <div class="content">
    <div class="badge"><a href="glass-variants.html">← All Variants</a> VARIANT 01 — DIAGONAL FLUTES</div>
    <h1>40 Years Behind the Mic.<br><em>One Mission: Your Local Dominance.</em></h1>
    <p class="sub">Mark Bishop — 40+ years of professional broadcasting experience. Founder of Mark Bishop Media, the Local Visibility Operating System.</p>
  </div>

  <script>
  (function(){
    const canvas = document.getElementById('bg');
    const gl = canvas.getContext('webgl',{alpha:false,antialias:false,powerPreference:'high-performance'});
    if(!gl) return;

    const VERT = `attribute vec2 a_pos; void main(){gl_Position=vec4(a_pos,0,1);}`;
    const FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform vec2 u_res;
    uniform float u_time;

    // Smooth random noise for colorful background blobs
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p),f=fract(p);
      f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
    }
    float fbm(vec2 p){
      float v=0.,a=.5;
      for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.0;a*=.5;}
      return v;
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / u_res;
      vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
      float t = u_time * 0.15;

      // Rotate coordinates by 45 degrees for DIAGONAL flutes
      float angle = 0.785398; // 45 degrees in radians
      float c = cos(angle), s = sin(angle);
      mat2 rot = mat2(c, -s, s, c);
      vec2 rp = rot * p;

      // 1. CREATE DIAGONAL FLUTED GLASS DISTORTION
      float flutes = 60.0;
      float cell = fract((rp.x + 1.0) * flutes) - 0.5;
      // Refraction offset based on the curve of the glass flute
      float prism = sin(cell * 3.14159) * 0.05; 
      
      // We distort the base coordinates (p) based on the diagonal flute
      vec2 distortedP = p + vec2(prism * c, prism * s); // apply distortion in diagonal direction

      // 2. GENERATE BACKGROUND COLORS (NO BLACK)
      // We use multiple low-frequency noise layers moving in different directions
      float n1 = fbm(distortedP * 1.5 + vec2(t, t*0.5));
      float n2 = fbm(distortedP * 1.8 - vec2(t*0.8, -t*0.4));
      float n3 = fbm(distortedP * 1.2 + vec2(-t*0.6, t*0.7));

      // MBM Colors
      vec3 cyan = vec3(0.0, 0.83, 1.0);
      vec3 green = vec3(0.72, 1.0, 0.34);
      vec3 purple = vec3(0.48, 0.19, 0.97);
      
      // Base color is a deep rich mixture (ensures no true black)
      vec3 col = mix(vec3(0.05, 0.1, 0.2), cyan, n1);
      col = mix(col, purple, n2 * 0.8);
      col = mix(col, green, n3 * 0.5);

      // Boost saturation and brightness so it looks premium
      col = col * 1.2;

      // 3. ADD GLASS HIGHLIGHTS
      // The ridges of the fluted glass catch light
      float edge = abs(cell) * 2.0; // 0 at center, 1 at edges
      float highlight = pow(edge, 4.0) * 0.15;
      col += vec3(1.0) * highlight;
      
      // Subtle darkening in the deep parts of the flute
      float shadow = pow(1.0 - edge, 2.0) * 0.1;
      col -= vec3(shadow);

      // Vignette
      float vig = 1.0 - length(p) * 0.5;
      col *= vig;

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`;

    function compile(type,src){
      const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
      return s;
    }
    const pg=gl.createProgram();
    gl.attachShader(pg,compile(gl.VERTEX_SHADER,VERT));
    gl.attachShader(pg,compile(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(pg);gl.useProgram(pg);

    const buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pg,'a_pos');
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

    const uRes=gl.getUniformLocation(pg,'u_res');
    const uTime=gl.getUniformLocation(pg,'u_time');

    function resize(){
      const dpr=Math.min(devicePixelRatio,1.5);
      canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
      gl.viewport(0,0,canvas.width,canvas.height);
    }
    resize();addEventListener('resize',resize);

    const start=performance.now();
    (function loop(){
      requestAnimationFrame(loop);
      gl.uniform2f(uRes,canvas.width,canvas.height);
      gl.uniform1f(uTime,(performance.now()-start)/1000);
      gl.drawArrays(gl.TRIANGLES,0,3);
    })();
  })();
  </script>
</body>
</html>
