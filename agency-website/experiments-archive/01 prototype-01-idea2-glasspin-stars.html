<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBM · Local Visibility — Phase 1 Master Preloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Three.js & GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020205;font-family:'Space Grotesk',sans-serif;color:#fff;user-select:none}

/* ═══════════════════════════════════════════════════════════
   PRELOADER OVERLAY (2.4s Pure Echosyst-style Auto Curtain)
   ═══════════════════════════════════════════════════════════ */
#preloader-screen{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#020205;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity 0.9s cubic-bezier(0.65, 0, 0.35, 1), transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), filter 0.9s ease;
}

#preloader-screen.exit-curtain{
  opacity:0;
  transform:scale(1.05);
  filter:blur(14px);
  pointer-events:none;
}

/* 3D WebGL Canvas */
#canvas-3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

/* Cinematic Edge Optics */
.cinema-vignette{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(circle at center, transparent 30%, rgba(2,2,5,0.45) 70%, #020205 100%);
  box-shadow:inset 0 0 100px rgba(0,0,0,0.9);
}

/* ─── PURE BRAND TYPOGRAPHY & PROGRESS ─── */
.preloader-content{
  position:relative;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  pointer-events:none;
  margin-top:140px;
}

/* Ultra-High Contrast Brand Title */
.brand-title{
  font-size:clamp(28px, 5.5vw, 52px);
  font-weight:800;
  letter-spacing:0.12em;
  line-height:1;
  text-transform:uppercase;
  color:#ffffff;
  text-shadow:0 0 40px rgba(0,212,255,0.6), 0 2px 20px rgba(0,0,0,0.9);
  opacity:0;
  transform:translateY(16px);
  filter:blur(6px);
  will-change:transform,opacity,filter;
}

.brand-title span{
  background:linear-gradient(135deg, #00d4ff 0%, #b8ff57 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Prominent Laser-Sharp Capsule Badge */
.brand-subline{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(12px, 1.8vw, 15px);
  font-weight:700;
  letter-spacing:0.45em;
  color:#00d4ff;
  text-transform:uppercase;
  margin-top:14px;
  background:rgba(0,212,255,0.08);
  border:1px solid rgba(0,212,255,0.35);
  padding:6px 22px;
  border-radius:100px;
  box-shadow:0 0 25px rgba(0,212,255,0.25);
  opacity:0;
  transform:translateY(10px);
}

/* Minimalist Razor Progress Line */
.progress-container{
  margin-top:28px;
  width:160px;
  height:2px;
  background:rgba(255,255,255,0.06);
  border-radius:2px;
  overflow:hidden;
  position:relative;
  opacity:0;
}

.progress-line{
  width:0%;
  height:100%;
  background:linear-gradient(90deg, #00d4ff, #b8ff57);
  box-shadow:0 0 12px #00d4ff;
  border-radius:2px;
}

/* Sound Control Button (Bottom Right) */
.audio-dock{
  position:absolute;
  bottom:24px;
  right:32px;
  z-index:20;
  pointer-events:all;
}

.audio-btn{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.5);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:0.15em;
  padding:6px 14px;
  border-radius:100px;
  cursor:pointer;
  backdrop-filter:blur(8px);
  transition:all 0.3s ease;
}
.audio-btn:hover{
  background:rgba(0,212,255,0.15);
  border-color:#00d4ff;
  color:#fff;
}

/* ═══════════════════════════════════════════════════════════
   HERO DESTINATION STAGE (Revealed automatically at 2.4s)
   ═══════════════════════════════════════════════════════════ */
#hero-stage{
  position:fixed;
  inset:0;
  z-index:1;
  background:#020205;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px;
}

.hero-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.25em;
  color:#b8ff57;
  background:rgba(184,255,87,0.08);
  border:1px solid rgba(184,255,87,0.25);
  padding:6px 18px;
  border-radius:100px;
  margin-bottom:20px;
}

.hero-h1{
  font-size:clamp(38px, 6.5vw, 76px);
  font-weight:800;
  line-height:1.05;
  letter-spacing:-0.03em;
  margin-bottom:22px;
  max-width:920px;
}

.hero-h1 span{
  background:linear-gradient(135deg, #00d4ff 0%, #b8ff57 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-p{
  font-family:'Inter',sans-serif;
  font-size:clamp(14px, 1.8vw, 18px);
  color:rgba(255,255,255,0.6);
  max-width:640px;
  line-height:1.6;
  margin-bottom:36px;
}

.hero-btn{
  background:linear-gradient(135deg, #00d4ff, #b8ff57);
  color:#020205;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:0.06em;
  padding:15px 36px;
  border-radius:100px;
  border:none;
  cursor:pointer;
  box-shadow:0 0 35px rgba(0,212,255,0.45);
  transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.hero-btn:hover{
  transform:scale(1.06);
  box-shadow:0 0 50px rgba(184,255,87,0.7);
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     THE MASTER PRELOADER: 3D GLASS PIN & 5-STAR ORBIT
     ═══════════════════════════════════════════════════════════ -->
<div id="preloader-screen">
  <canvas id="canvas-3d"></canvas>
  <div class="cinema-vignette"></div>

  <div class="preloader-content">
    <h1 class="brand-title" id="brand-title">MARK BISHOP <span>MEDIA</span></h1>
    <div class="brand-subline" id="brand-subline">LOCAL VISIBILITY DIVISION</div>

    <div class="progress-container" id="progress-container">
      <div class="progress-line" id="progress-line"></div>
    </div>
  </div>

  <div class="audio-dock">
    <button class="audio-btn" id="audio-btn">🔊 SOUND: ON</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     HERO LANDING STAGE (Seamless Target)
     ═══════════════════════════════════════════════════════════ -->
<div id="hero-stage">
  <div class="hero-tag">PHASE 1 COMPLETE · MASTER SPLASH PRELOADER</div>
  <h1 class="hero-h1">Your Customers Are Searching.<br>Are They Finding <span>YOU?</span></h1>
  <p class="hero-p">We turn hidden local businesses into dominant market leaders through data-backed Google Map authority, citation networks, and autonomous visibility systems.</p>
  <button class="hero-btn" onclick="triggerPreloader()">↻ REPLAY 3D INTRO SPLASH</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   THREE.JS 3D GLASS PIN + 5-STAR COMET TRAILS + HARMONICS
   ═══════════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('canvas-3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.2, 22);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ─── 1. FULL-SCREEN COSMIC STARFIELD (750+ Edge-to-Edge Particles) ─── */
const starfieldCount = 800;
const starfieldGeo = new THREE.BufferGeometry();
const starfieldPos = new Float32Array(starfieldCount * 3);
const starfieldColors = new Float32Array(starfieldCount * 3);

const colCyan = new THREE.Color(0x00d4ff);
const colLime = new THREE.Color(0xb8ff57);
const colWhite = new THREE.Color(0xffffff);

for (let i = 0; i < starfieldCount * 3; i += 3) {
  starfieldPos[i] = (Math.random() - 0.5) * 65;
  starfieldPos[i + 1] = (Math.random() - 0.5) * 45;
  starfieldPos[i + 2] = (Math.random() - 0.5) * 40;

  const randCol = Math.random();
  const c = randCol > 0.6 ? colCyan : (randCol > 0.25 ? colLime : colWhite);
  starfieldColors[i] = c.r;
  starfieldColors[i + 1] = c.g;
  starfieldColors[i + 2] = c.b;
}

starfieldGeo.setAttribute('position', new THREE.BufferAttribute(starfieldPos, 3));
starfieldGeo.setAttribute('color', new THREE.BufferAttribute(starfieldColors, 3));

const starfieldMat = new THREE.PointsMaterial({
  size: 0.2,
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const fullScreenStarfield = new THREE.Points(starfieldGeo, starfieldMat);
scene.add(fullScreenStarfield);

/* ─── 2. CENTRAL 3D GLASS GOOGLE MAP PIN ─── */
const pinGroup = new THREE.Group();
pinGroup.position.set(0, 3.2, 0);
scene.add(pinGroup);

// Pin Head (Glass Sphere)
const headGeo = new THREE.SphereGeometry(2.4, 32, 32);
const headMat = new THREE.MeshBasicMaterial({
  color: 0x00d4ff,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});
const headMesh = new THREE.Mesh(headGeo, headMat);
headMesh.position.y = 1.2;
pinGroup.add(headMesh);

// Glowing Heartbeat Core Emerald Sphere
const coreGeo = new THREE.SphereGeometry(1.15, 24, 24);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xb8ff57, transparent: true, opacity: 0.95 });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
coreMesh.position.y = 1.2;
pinGroup.add(coreMesh);

// Lower Cone Tip
const tipGeo = new THREE.ConeGeometry(2.38, 3.8, 32);
const tipMat = new THREE.MeshBasicMaterial({
  color: 0x00d4ff,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});
const tipMesh = new THREE.Mesh(tipGeo, tipMat);
tipMesh.rotation.x = Math.PI;
tipMesh.position.y = -0.7;
pinGroup.add(tipMesh);

// Concentric Orbit Halo Rings
const ringGeo = new THREE.TorusGeometry(5.4, 0.035, 16, 120);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.35 });
const halo1 = new THREE.Mesh(ringGeo, ringMat);
const halo2 = new THREE.Mesh(ringGeo, ringMat);
halo2.rotation.x = Math.PI / 2.8;
pinGroup.add(halo1);
pinGroup.add(halo2);

/* ─── 3. FIVE 3D GOLDEN STARS + COMET LIGHT TRAILS ─── */
const starGroup = new THREE.Group();
pinGroup.add(starGroup);

const starShape = new THREE.Shape();
const pts = 5;
const rOut = 0.65;
const rIn = 0.3;
for (let i = 0; i < pts * 2; i++) {
  const r = i % 2 === 0 ? rOut : rIn;
  const angle = (i * Math.PI) / pts - Math.PI / 2;
  const x = Math.cos(angle) * r;
  const y = Math.sin(angle) * r;
  if (i === 0) starShape.moveTo(x, y);
  else starShape.lineTo(x, y);
}
starShape.closePath();

const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.06, bevelThickness: 0.06 });
const starMat = new THREE.MeshBasicMaterial({ color: 0xb8ff57 });

const starMeshes = [];
const starTrails = [];
const TRAIL_LENGTH = 16;

for (let i = 0; i < 5; i++) {
  // 1. Star Mesh
  const mesh = new THREE.Mesh(starGeo, starMat);
  mesh.scale.set(0.001, 0.001, 0.001);
  starGroup.add(mesh);
  starMeshes.push(mesh);

  // 2. Comet Light Trail Points
  const trailGeo = new THREE.BufferGeometry();
  const trailPositions = new Float32Array(TRAIL_LENGTH * 3);
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
  
  const trailMat = new THREE.PointsMaterial({
    color: i % 2 === 0 ? 0xb8ff57 : 0x00d4ff,
    size: 0.18,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending
  });
  const trailPoints = new THREE.Points(trailGeo, trailMat);
  starGroup.add(trailPoints);

  starTrails.push({
    points: trailPoints,
    history: []
  });
}

/* ─── 4. PROCEDURAL CRYSTAL HARMONICS AUDIO SYNTH ─── */
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playCrystalResonance() {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  
  // 528Hz & 852Hz crystal transformation harmonics
  const freqs = [528, 660, 792, 1056];
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.linearRampToValueAtTime(0.035, now + 0.8);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);
  gain.connect(audioCtx.destination);

  freqs.forEach((f, idx) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.linearRampToValueAtTime(f * 1.008, now + 2.0);
    osc.connect(gain);
    osc.start(now + idx * 0.06);
    osc.stop(now + 2.5);
  });
}

document.getElementById('audio-btn').addEventListener('click', function() {
  soundEnabled = !soundEnabled;
  this.textContent = soundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
  if (soundEnabled) initAudio();
});

/* ─── 5. MASTER 2.4-SECOND PRELOADER TIMELINE (GSAP) ─── */
let masterTL;

function triggerPreloader() {
  initAudio();
  playCrystalResonance();

  const preloader = document.getElementById('preloader-screen');
  preloader.classList.remove('exit-curtain');

  // Reset GSAP States
  gsap.set(pinGroup.scale, { x: 0.001, y: 0.001, z: 0.001 });
  starMeshes.forEach(s => gsap.set(s.scale, { x: 0.001, y: 0.001, z: 0.001 }));
  gsap.set('#brand-title', { opacity: 0, y: 16, filter: 'blur(6px)' });
  gsap.set('#brand-subline', { opacity: 0, y: 10 });
  gsap.set('#progress-container', { opacity: 0 });
  gsap.set('#progress-line', { width: '0%' });

  masterTL = gsap.timeline({
    onComplete: () => {
      // 2.4s Auto-Dismiss into Hero Section (Exact Echosyst flow)
      preloader.classList.add('exit-curtain');
    }
  });

  // Step 1: 3D Glass Pin Scales in with elastic bounce (0.0s - 0.9s)
  masterTL.to(pinGroup.scale, { x: 1, y: 1, z: 1, duration: 1.1, ease: "elastic.out(1.2, 0.6)" }, 0.1);

  // Step 2: 5 Stars Emerge into Orbit with Comet Trails (0.3s - 1.2s)
  starMeshes.forEach((s, idx) => {
    masterTL.to(s.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "back.out(2)" }, 0.3 + idx * 0.1);
  });

  // Step 3: High-Contrast Brand Typography Deblur (0.5s - 1.1s)
  masterTL.to('#brand-title', { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: "power3.out" }, 0.5);
  masterTL.to('#brand-subline', { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.7);

  // Step 4: Liquid Progress Line Sweeps to 100% (0.6s - 2.2s)
  masterTL.to('#progress-container', { opacity: 1, duration: 0.3 }, 0.6);
  masterTL.to('#progress-line', { width: '100%', duration: 1.5, ease: "power2.inOut" }, 0.7);

  // Step 5: Heartbeat Core Pulse right before Curtain Exit (2.1s - 2.4s)
  masterTL.to(coreMesh.scale, { x: 1.45, y: 1.45, z: 1.45, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out" }, 2.1);
  masterTL.to(pinGroup.scale, { x: 1.08, y: 1.08, z: 1.08, duration: 0.2, yoyo: true, repeat: 1 }, 2.2);
}

// ─── 6. INTERACTIVE 3D PARALLAX & CONTINUOUS ANIMATION LOOP ───
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Smooth Camera Tilt
  camera.position.x += (mouseX * 3.5 - camera.position.x) * 0.04;
  camera.position.y += (-mouseY * 2.5 + 1.2 - camera.position.y) * 0.04;
  camera.lookAt(0, 1.2, 0);

  // Rotate 3D Glass Pin
  pinGroup.rotation.y = time * 0.5;

  // 5 Stars Orbiting + Comet Trails Update
  const orbitR = 5.4;
  starMeshes.forEach((star, idx) => {
    const angle = time * 1.5 + (idx * (Math.PI * 2 / 5));
    const sx = Math.cos(angle) * orbitR;
    const sz = Math.sin(angle) * orbitR;
    const sy = Math.sin(time * 2.5 + idx) * 0.7;

    star.position.set(sx, sy, sz);
    star.rotation.y = time * 2;
    star.rotation.z = Math.sin(time + idx) * 0.5;

    // Record trail history
    const trail = starTrails[idx];
    trail.history.unshift({ x: sx, y: sy, z: sz });
    if (trail.history.length > TRAIL_LENGTH) trail.history.pop();

    // Update trail buffer positions
    const posArray = trail.points.geometry.attributes.position.array;
    for (let j = 0; j < TRAIL_LENGTH; j++) {
      if (j < trail.history.length) {
        posArray[j * 3] = trail.history[j].x;
        posArray[j * 3 + 1] = trail.history[j].y;
        posArray[j * 3 + 2] = trail.history[j].z;
      }
    }
    trail.points.geometry.attributes.position.needsUpdate = true;
  });

  halo1.rotation.z = time * 0.3;
  halo2.rotation.y = -time * 0.4;

  // Swirl Starfield
  fullScreenStarfield.rotation.y = time * 0.03;
  fullScreenStarfield.rotation.x = Math.sin(time * 0.1) * 0.05;

  renderer.render(scene, camera);
}

animate();
window.addEventListener('load', () => {
  setTimeout(triggerPreloader, 150);
});
</script>
</body>
</html>
