<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MBM · 3D Storefront Pin & Orbiting Stars (Clean Intro Clone Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Three.js & OrbitControls & GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-core:#020205;
  --cyan-glow:#00d4ff;
  --lime-glow:#b8ff57;
  --gold-glow:#ffd700;
  --panel-bg:rgba(11, 16, 29, 0.94);
  --panel-border:rgba(0, 212, 255, 0.35);
}

body{
  background-color:var(--bg-core);
  color:#ffffff;
  font-family:'Space Grotesk',sans-serif;
  height:100vh;
  width:100vw;
  overflow:hidden;
  user-select:none;
}

/* CYBER MATRIX GRID BACKGROUND */
body::before{
  content:'';
  position:fixed;
  top:0;left:0;width:100vw;height:100vh;
  background-image:
    radial-gradient(circle at 50% 15%, rgba(0, 212, 255, 0.14) 0%, transparent 65%),
    linear-gradient(to right, rgba(0, 212, 255, 0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0, 212, 255, 0.035) 1px, transparent 1px);
  background-size:100% 100%, 50px 50px, 50px 50px;
  pointer-events:none;
  z-index:1;
}

/* TOP AMBIENT NEON FLARE */
.ambient-glow-top{
  position:fixed;
  top:-180px;
  left:50%;
  transform:translateX(-50%);
  width:1050px;
  height:480px;
  background:radial-gradient(circle, rgba(0, 212, 255, 0.22) 0%, rgba(184, 255, 87, 0.12) 45%, transparent 75%);
  filter:blur(100px);
  pointer-events:none;
  z-index:2;
}

/* 3D CANVAS & CINEMA VIGNETTE */
#webgl-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.cinema-vignette{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:radial-gradient(circle at center, transparent 35%, rgba(2,2,5,0.45) 75%, #020205 100%);
}

/* TOP HUD HEADER */
.top-hud{
  position:absolute;
  top:20px;
  left:24px;
  right:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:100;
  pointer-events:none;
}

.hud-title-card{
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  box-shadow:0 12px 35px rgba(0,0,0,0.85), 0 0 25px rgba(0,212,255,0.25);
  backdrop-filter:blur(18px);
  border-radius:14px;
  padding:14px 22px;
  pointer-events:auto;
  max-width:500px;
}

.hud-badge{
  font-family:'JetBrains Mono', monospace;
  font-size:10px;
  font-weight:800;
  color:#00d4ff;
  letter-spacing:0.2em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:5px;
}
.hud-badge .pulse-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#b8ff57;
  box-shadow:0 0 10px #b8ff57;
  animation:pulseGreen 1.5s infinite;
}
@keyframes pulseGreen{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:0.5}}

.hud-main-title{
  font-size:17px;
  font-weight:800;
  letter-spacing:0.04em;
  color:#fff;
  line-height:1.25;
}
.hud-main-title span{
  background:linear-gradient(135deg, #00d4ff, #b8ff57);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hud-desc{
  font-family:'Inter', sans-serif;
  font-size:11.5px;
  color:rgba(255,255,255,0.75);
  line-height:1.45;
  margin-top:6px;
}

.hud-actions{
  display:flex;
  align-items:center;
  gap:10px;
  pointer-events:auto;
}
.btn-action{
  background:rgba(0, 212, 255, 0.15);
  border:1px solid rgba(0, 212, 255, 0.5);
  color:#00d4ff;
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;
  font-weight:800;
  padding:8px 16px;
  border-radius:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all 0.2s;
}
.btn-action:hover{
  background:#00d4ff;
  color:#020205;
  box-shadow:0 0 20px rgba(0, 212, 255, 0.6);
}
</style>
</head>
<body>

<div class="ambient-glow-top"></div>
<canvas id="webgl-canvas"></canvas>
<div class="cinema-vignette"></div>

<!-- Top HUD Card -->
<div class="top-hud">
  <div class="hud-title-card">
    <div class="hud-badge">
      <span class="pulse-dot"></span>
      <span>3D INTRO DESIGN · CLEAN CLONE PROTOTYPE</span>
    </div>
    <div class="hud-main-title">3D Storefront Pin & <span>5-Star Orbitals</span></div>
    <div class="hud-desc">
      ইনট্রো স্প্ল্যাশের হুবহু ৩ডি ডিজাইন (স্টোরফ্রন্ট বিল্ডিং, ওয়্যারফ্রেম পিন, ৫টি গোল্ডেন স্টার ও স্টার্ডাস্ট পার্টিকেল) এখানে ক্লিন অবস্থায় লোড করা হয়েছে।
    </div>
  </div>

  <div class="hud-actions">
    <button class="btn-action" onclick="resetStoryCamera()">🎯 RESET VIEW</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   1. THREE.JS SCENE, LIGHTS & SHADERS (EXACT CLEAN CLONE FROM INTRO)
   ═══════════════════════════════════════════════════════════ */
const canvas = document.getElementById('webgl-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.8, 22);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 45;
controls.minDistance = 8;
controls.target.set(0, 1.2, 0);

// Lighting Rig
const ambLight = new THREE.AmbientLight(0x0a182e, 3.2); scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 3.5); dirLight.position.set(8, 14, 10); scene.add(dirLight);
const pointLight = new THREE.PointLight(0x00d4ff, 4.2, 35); pointLight.position.set(-6, 6, 8); scene.add(pointLight);

// 850 Stardust Particles (Exact Match from Intro)
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(850 * 3);
const dustCols = new Float32Array(850 * 3);
const cCyan = new THREE.Color(0x00d4ff), cLime = new THREE.Color(0xb8ff57), cWhite = new THREE.Color(0xffffff);

for (let i = 0; i < 850 * 3; i += 3) {
  dustPos[i] = (Math.random() - 0.5) * 65;
  dustPos[i + 1] = (Math.random() - 0.5) * 45;
  dustPos[i + 2] = (Math.random() - 0.5) * 40;
  const rand = Math.random();
  const c = rand > 0.55 ? cCyan : (rand > 0.25 ? cLime : cWhite);
  dustCols[i] = c.r; dustCols[i + 1] = c.g; dustCols[i + 2] = c.b;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCols, 3));
const dustMat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending });
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

// ═══════════════════════════════════════════════════════════
// 2. 3D GLASS STOREFRONT PIN (EXACT MATCH FROM INTRO)
// ═══════════════════════════════════════════════════════════
const pinGroup = new THREE.Group();
pinGroup.position.set(0, 1.2, 0);
scene.add(pinGroup);

const headGeo = new THREE.SphereGeometry(2.4, 32, 32);
const headMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true, transparent: true, opacity: 0.45 });
pinGroup.add(new THREE.Mesh(headGeo, headMat));

// 3D Storefront Building
const shopGroup = new THREE.Group();
pinGroup.add(shopGroup);

const shopMats = {
  wall: new THREE.MeshStandardMaterial({ color: 0x0055aa, roughness: 0.2, metalness: 0.3, emissive: 0x001133 }),
  roofCyan: new THREE.MeshStandardMaterial({ color: 0x00d4ff, roughness: 0.2, metalness: 0.1, emissive: 0x00d4ff, emissiveIntensity: 0.35 }),
  roofWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1, emissive: 0xffffff, emissiveIntensity: 0.2 }),
  glassCyan: new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.85, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.95 }),
  doorWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x00d4ff, emissiveIntensity: 0.75, roughness: 0.2 }),
  foundation: new THREE.MeshStandardMaterial({ color: 0x04101e, roughness: 0.4, metalness: 0.6 })
};

const shopBase = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.2, 32), shopMats.foundation);
shopBase.position.y = -0.6;
shopGroup.add(shopBase);

const shopWalls = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.45, 1.55), shopMats.wall);
shopWalls.position.y = 0.2;
shopGroup.add(shopWalls);

const awningGroup = new THREE.Group();
awningGroup.position.set(0, 0.7, 0.88);
awningGroup.rotation.x = Math.PI / 4.5;
for (let i = -3; i <= 3; i++) {
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.06, 0.7), i % 2 === 0 ? shopMats.roofCyan : shopMats.roofWhite);
  stripe.position.x = i * 0.27;
  awningGroup.add(stripe);
}
shopGroup.add(awningGroup);

const winGlass = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.08), shopMats.glassCyan);
winGlass.position.set(-0.42, 0.15, 0.79);
shopGroup.add(winGlass);

const shopDoor = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.9, 0.08), shopMats.doorWhite);
shopDoor.position.set(0.45, 0.0, 0.79);
shopGroup.add(shopDoor);

const tipGeo = new THREE.ConeGeometry(2.38, 3.8, 32);
const tipMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true, transparent: true, opacity: 0.45 });
const tipMesh = new THREE.Mesh(tipGeo, tipMat);
tipMesh.rotation.x = Math.PI;
tipMesh.position.y = -0.7;
pinGroup.add(tipMesh);

// ═══════════════════════════════════════════════════════════
// 3. FIVE 3D GOLDEN STARS + ORBIT SYSTEM (EXACT FROM INTRO)
// ═══════════════════════════════════════════════════════════
const starGroup = new THREE.Group();
pinGroup.add(starGroup);

const starShape = new THREE.Shape();
const pts = 5;
const rOut = 0.65, rIn = 0.3;
for (let i = 0; i < pts * 2; i++) {
  const r = i % 2 === 0 ? rOut : rIn;
  const angle = (i * Math.PI) / pts - Math.PI / 2;
  const x = Math.cos(angle) * r;
  const y = Math.sin(angle) * r;
  if (i === 0) starShape.moveTo(x, y);
  else starShape.lineTo(x, y);
}
starShape.closePath();

const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.06, bevelThickness: 0.06 });
const starMat = new THREE.MeshStandardMaterial({
  color: 0xc4ff3b, emissive: 0x95d600, emissiveIntensity: 0.75, roughness: 0.2, metalness: 0.7
});

const starMeshes = [];
for (let i = 0; i < 5; i++) {
  const star = new THREE.Mesh(starGeo, starMat);
  starGroup.add(star);
  starMeshes.push(star);
}

// Orbiting Halos
const haloMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true, transparent: true, opacity: 0.4 });
const halo1 = new THREE.Mesh(new THREE.TorusGeometry(3.8, 0.03, 8, 48), haloMat);
const halo2 = new THREE.Mesh(new THREE.TorusGeometry(4.6, 0.025, 8, 48), haloMat);
halo1.rotation.x = Math.PI / 2.2;
halo2.rotation.x = Math.PI / 2.8;
pinGroup.add(halo1);
pinGroup.add(halo2);

// ═══════════════════════════════════════════════════════════
// 4. ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  pinGroup.rotation.y = time * 0.25;
  dust.rotation.y = time * 0.02;

  halo1.rotation.z = time * 0.15;
  halo2.rotation.y = -time * 0.2;

  // 5 Extruded Golden Stars Orbiting
  const orbitR = 4.8;
  starMeshes.forEach((star, idx) => {
    const angle = time * 1.0 + (idx * (Math.PI * 2 / 5));
    const sx = Math.cos(angle) * orbitR;
    const sz = Math.sin(angle) * orbitR;
    const sy = Math.sin(time * 1.8 + idx) * 0.6;

    star.position.set(sx, sy, sz);
    star.rotation.y = time * 1.4;
    star.rotation.z = Math.sin(time + idx) * 0.4;
  });

  controls.update();
  renderer.render(scene, camera);
}

function resetStoryCamera() {
  gsap.to(camera.position, { x: 0, y: 1.8, z: 22, duration: 1.0, ease: 'power2.inOut' });
  controls.target.set(0, 1.2, 0);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
