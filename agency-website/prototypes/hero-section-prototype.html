<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Bishop Media · Hero Section (Desktop Version)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:#020205;
  font-family:'Space Grotesk',sans-serif;
  color:#fff;
  overflow-x:hidden;
}

/* 3D CANVAS & VIGNETTE */
#master-3d-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:1;
  pointer-events:none;
}
.scene-vignette{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(circle at center, transparent 35%, rgba(2,2,5,0.45) 75%, #020205 100%);
}

/* NAVIGATION REMOVED FROM HERO PROTOTYPE */

/* HERO VIEWPORT */
.hero-wrapper{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:0 5%;
  z-index:10;
  pointer-events:none;
}
.hero-inner-container{
  max-width:1320px;
  width:100%;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.hero-left-content {
  position: relative;
  z-index: 30;
  max-width: 580px;
  width: 100%;
  opacity: 1;
  transform: none;
  filter: none;
  pointer-events: all;
}

.hero-pill-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(0, 212, 255, 0.08);
  border:1px solid rgba(0, 212, 255, 0.35);
  box-shadow:0 0 20px rgba(0, 212, 255, 0.2);
  padding:5px 16px;
  border-radius:100px;
  margin-bottom:20px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.22em;
  color:#00d4ff;
}
.hero-pill-badge span.pulse-dot{width:6px;height:6px;border-radius:50%;background:#b8ff57;box-shadow:0 0 10px #b8ff57}

.hero-headline{
  font-size:46px;
  font-weight:800;
  line-height:1.20;
  letter-spacing:-0.03em;
  margin-bottom:20px;
  text-transform:uppercase;
}
.hero-headline .glass-capsule{
  display:inline-block;
  background:rgba(0, 212, 255, 0.12);
  border:1.5px solid rgba(0, 212, 255, 0.6);
  box-shadow:0 0 25px rgba(0, 212, 255, 0.35), inset 0 0 15px rgba(0, 212, 255, 0.2);
  padding:2px 14px;
  border-radius:12px;
  color:#00d4ff;
  text-shadow:0 0 15px rgba(0, 212, 255, 0.8);
  margin:4px 0;
}
.hero-headline .lime-accent{
  color:#b8ff57;
  text-shadow:0 0 20px rgba(184, 255, 87, 0.7);
}

.hero-ticker-line{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:700;
  margin-bottom:32px;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:24px;
}
.ticker-label{color:rgba(255,255,255,0.6);letter-spacing:0.08em;text-transform:uppercase}
.ticker-val-container{position:relative;display:inline-block;overflow:hidden}
.ticker-val{color:#b8ff57;display:inline-block;white-space:nowrap;text-shadow:0 0 15px rgba(184, 255, 87, 0.4)}

.btn-primary-glow{
  background:linear-gradient(135deg, #00d4ff, #b8ff57);
  color:#020205;
  font-family:'Space Grotesk',sans-serif;
  font-size:13.5px;
  font-weight:800;
  letter-spacing:0.06em;
  padding:15px 36px;
  border-radius:100px;
  border:none;
  cursor:pointer;
  box-shadow:0 0 35px rgba(0,212,255,0.5);
  transition:all 0.3s ease;
  display:inline-flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
}
.btn-primary-glow:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 0 50px rgba(184,255,87,0.75)}
#hero-left { opacity: 1 !important; transform: none !important; filter: none !important; visibility: visible !important; }
</style>
</head>
<body>

<!-- 1. MASTER 3D CANVAS -->
<canvas id="master-3d-canvas"></canvas>
<div class="scene-vignette"></div>

<!-- NAVIGATION REMOVED: HERO ONLY -->

<!-- 4. HERO SECTION -->
<main class="hero-wrapper">
  <div class="hero-inner-container">
    <div class="hero-left-content" id="hero-left">
      <div class="hero-pill-badge">
        <span class="pulse-dot"></span>
        <span>LOCAL VISIBILITY OPERATING SYSTEM</span>
      </div>

      <h1 class="hero-headline">
        YOUR LOCAL CLIENTS<br>
        <span class="glass-capsule">ARE SEARCHING</span><br>
        WE MAKE SURE THEY<br>
        FIND <span class="lime-accent">YOU FIRST.</span>
      </h1>

      <div class="hero-ticker-line">
        <span class="ticker-label" id="ticker-label">DOMINANCE ENGINE:</span>
        <div class="ticker-val-container">
          <span class="ticker-val" id="ticker-val">9-Mile Local Geo-Grid Coverage</span>
        </div>
      </div>

      <div>
        <a href="#what-we-do" class="btn-primary-glow">
          <span>⚡ EXPLORE WHAT WE DO</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </div>
</main>

<script>
/* ─── DYNAMIC TICKER ─── */
const tickerItems = [
  { label: "DOMINANCE ENGINE:", val: "9-Mile Local Geo-Grid Coverage" },
  { label: "DOMINANCE TARGET:", val: "#1 Google Maps 3-Pack Positioning" },
  { label: "CITATION NETWORK:", val: "150+ Synchronized Authority Directories" },
  { label: "REPUTATION PROTOCOL:", val: "Automated 5-Star Review Velocity" },
  { label: "REVENUE PIPELINE:", val: "Predictable High-Ticket Inbound Calls" }
];

let currentTickerIdx = 0;
const tickerLabelEl = document.getElementById('ticker-label');
const tickerValEl = document.getElementById('ticker-val');

function cycleTicker() {
  currentTickerIdx = (currentTickerIdx + 1) % tickerItems.length;
  const nextItem = tickerItems[currentTickerIdx];

  gsap.to(tickerValEl, {
    y: -14, opacity: 0, filter: 'blur(4px)', duration: 0.35, ease: "power2.in",
    onComplete: () => {
      tickerLabelEl.innerText = nextItem.label;
      tickerValEl.innerText = nextItem.val;
      gsap.set(tickerValEl, { y: 14, opacity: 0, filter: 'blur(4px)' });
      gsap.to(tickerValEl, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: "power2.out" });
    }
  });
}
setInterval(cycleTicker, 3200);

/* ─── THREE.JS & GSAP DESKTOP SCENE ─── */
const canvas = document.getElementById('master-3d-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.2, 22);

const lookAtTarget = { x: 0, y: 1.2, z: 0 };

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
onResize();

const ambLight = new THREE.AmbientLight(0x0a182e, 2.8); scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 3.2); dirLight.position.set(8, 14, 10); scene.add(dirLight);
const pointCyan = new THREE.PointLight(0x00d4ff, 3.8, 30); pointCyan.position.set(-6, 6, 8); scene.add(pointCyan);

/* ─── PROCEDURAL TEXTURES ─── */
function createCustomerTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.beginPath(); ctx.arc(32, 18, 9, 0, Math.PI * 2); ctx.fillStyle = '#00f0ff'; ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 10; ctx.fill();
  ctx.beginPath(); ctx.arc(32, 48, 15, Math.PI, 0, false); ctx.fillStyle = '#00f0ff'; ctx.fill();
  return new THREE.CanvasTexture(c);
}

function createUltraPurchaseBadge(icon, mainText, subText, colorHex, bgHex) {
  const c = document.createElement('canvas'); c.width = 360; c.height = 114;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bgHex; ctx.strokeStyle = colorHex; ctx.lineWidth = 3.5; ctx.shadowColor = colorHex; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.roundRect(10, 10, 340, 94, 20); ctx.fill(); ctx.stroke();
  ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = colorHex; ctx.fillText(icon, 28, 57);
  ctx.font = 'bold 26px "Space Grotesk", sans-serif'; ctx.fillStyle = '#ffffff'; ctx.fillText(mainText, 84, 44);
  ctx.font = 'bold 15px "JetBrains Mono", monospace'; ctx.fillStyle = colorHex; ctx.fillText(subText, 84, 74);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function createFloatingHoverBannerTexture() {
  const c = document.createElement('canvas');
  c.width = 480; c.height = 120;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(6, 22, 38, 0.98)';
  ctx.strokeStyle = '#b8ff57';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#b8ff57';
  ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.roundRect(10, 10, 460, 100, 24); ctx.fill(); ctx.stroke();
  ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#b8ff57'; ctx.fillText('🏪', 30, 60);
  ctx.font = '800 30px "Space Grotesk", sans-serif'; ctx.fillStyle = '#ffffff'; ctx.fillText('SMALL BUSINESS', 96, 46);
  ctx.font = 'bold 16px "JetBrains Mono", monospace'; ctx.fillStyle = '#00d4ff'; ctx.fillText('● VERIFIED LOCAL STOREFRONT', 96, 80);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

const customerTex = createCustomerTexture();
const hoverBannerTex = createFloatingHoverBannerTexture();
const purchaseTextures = [
  createUltraPurchaseBadge('💰', '+$450 BOOKING', 'LOCAL CLIENT ACQUIRED', '#b8ff57', 'rgba(6, 26, 16, 0.96)'),
  createUltraPurchaseBadge('📞', 'NEW INBOUND CALL', 'HIGH-INTENT BUYER', '#00d4ff', 'rgba(4, 20, 38, 0.96)'),
  createUltraPurchaseBadge('★', '5-STAR SERVICE SALE', 'AUTOMATED 3-PACK WIN', '#b8ff57', 'rgba(6, 26, 16, 0.96)'),
  createUltraPurchaseBadge('⚡', '+$680 RETAINER', 'REPEAT APPOINTMENT', '#b8ff57', 'rgba(6, 26, 16, 0.96)')
];

/* ─── 850 PARTICLES ─── */
const dustCount = 850;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustCols = new Float32Array(dustCount * 3);
const colCyan = new THREE.Color(0x00d4ff);
const colLime = new THREE.Color(0xb8ff57);
const colWhite = new THREE.Color(0xffffff);

for (let i = 0; i < dustCount * 3; i += 3) {
  dustPos[i] = (Math.random() - 0.5) * 65;
  dustPos[i + 1] = (Math.random() - 0.5) * 45;
  dustPos[i + 2] = (Math.random() - 0.5) * 40;
  const rand = Math.random();
  const c = rand > 0.55 ? colCyan : (rand > 0.25 ? colLime : colWhite);
  dustCols[i] = c.r; dustCols[i + 1] = c.g; dustCols[i + 2] = c.b;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCols, 3));
const dustMat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending });
scene.add(new THREE.Points(dustGeo, dustMat));

/* ─── MICRO CUSTOMER AVATARS ─── */
const customerGroup = new THREE.Group();
scene.add(customerGroup);
const customerMat = new THREE.SpriteMaterial({ map: customerTex, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
const customerAvatars = [];
for (let i = 0; i < 24; i++) {
  const sprite = new THREE.Sprite(customerMat);
  const angle = (i / 24) * Math.PI * 2 + Math.random() * 0.4;
  const dist = 18.0 + Math.random() * 8.0;
  const startX = Math.cos(angle) * dist;
  const startY = (Math.random() - 0.5) * 14.0 + 2.0;
  const startZ = Math.sin(angle) * dist * 0.35 - 2.0;
  sprite.position.set(startX, startY, startZ);
  sprite.scale.set(0.46, 0.46, 1);
  customerGroup.add(sprite);
  customerAvatars.push({
    sprite: sprite, startX: startX, startY: startY, startZ: startZ, angle: angle,
    speed: 0.0018 + Math.random() * 0.002, progress: (i / 24), floatOffset: Math.random() * Math.PI * 2
  });
}

/* ─── 3D PIN & STOREFRONT ─── */
const pinGroup = new THREE.Group();
pinGroup.position.set(7.6, -0.6, 0.0);
scene.add(pinGroup);

const headGeo = new THREE.SphereGeometry(2.4, 32, 32);
const headMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true, transparent: true, opacity: 0.35 });
const headMesh = new THREE.Mesh(headGeo, headMat);
headMesh.position.y = 1.2;
pinGroup.add(headMesh);

const shopGroup = new THREE.Group();
shopGroup.position.y = 1.2;
pinGroup.add(shopGroup);

const shopMats = {
  wall: new THREE.MeshStandardMaterial({ color: 0x082038, roughness: 0.3, metalness: 0.2 }),
  roofLime: new THREE.MeshStandardMaterial({ color: 0xb8ff57, roughness: 0.2, metalness: 0.1 }),
  roofDark: new THREE.MeshStandardMaterial({ color: 0x031020, roughness: 0.3, metalness: 0.1 }),
  glassCyan: new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.6, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.85 }),
  doorLime: new THREE.MeshStandardMaterial({ color: 0xb8ff57, emissive: 0xb8ff57, emissiveIntensity: 0.4, roughness: 0.2 }),
  foundation: new THREE.MeshStandardMaterial({ color: 0x04101e, roughness: 0.4, metalness: 0.6 })
};

const shopBase = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.2, 32), shopMats.foundation);
shopBase.position.y = -0.6;
shopGroup.add(shopBase);

const shopWalls = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.45, 1.55), shopMats.wall);
shopWalls.position.y = 0.2;
shopGroup.add(shopWalls);

const awningGroup = new THREE.Group();
awningGroup.position.set(0, 0.7, 0.88);
awningGroup.rotation.x = Math.PI / 4.5;
for (let i = -3; i <= 3; i++) {
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.06, 0.7), i % 2 === 0 ? shopMats.roofLime : shopMats.roofDark);
  stripe.position.x = i * 0.27;
  awningGroup.add(stripe);
}
shopGroup.add(awningGroup);

const winGlass = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.08), shopMats.glassCyan);
winGlass.position.set(-0.42, 0.15, 0.79);
shopGroup.add(winGlass);

const shopDoor = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.9, 0.08), shopMats.doorLime);
shopDoor.position.set(0.45, 0.0, 0.79);
shopGroup.add(shopDoor);

// Hover-Only Banner
const hoverBannerMat = new THREE.SpriteMaterial({ map: hoverBannerTex, transparent: true, opacity: 0.0, depthTest: false });
const hoverBannerSprite = new THREE.Sprite(hoverBannerMat);
hoverBannerSprite.position.set(0, 2.5, 0);
hoverBannerSprite.scale.set(0.001, 0.001, 0.001);
pinGroup.add(hoverBannerSprite);

const tipGeo = new THREE.ConeGeometry(2.38, 3.8, 32);
const tipMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true, transparent: true, opacity: 0.35 });
const tipMesh = new THREE.Mesh(tipGeo, tipMat);
tipMesh.rotation.x = Math.PI;
tipMesh.position.y = -0.7;
pinGroup.add(tipMesh);

const ringGeo = new THREE.TorusGeometry(5.4, 0.035, 16, 120);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.35 });
const halo1 = new THREE.Mesh(ringGeo, ringMat);
const halo2 = new THREE.Mesh(ringGeo, ringMat);
halo2.rotation.x = Math.PI / 2.8;
pinGroup.add(halo1);
pinGroup.add(halo2);

const purchaseRippleGeo = new THREE.RingGeometry(0.1, 0.5, 64);
const purchaseRippleMat = new THREE.MeshBasicMaterial({ color: 0xb8ff57, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
const purchaseRipple = new THREE.Mesh(purchaseRippleGeo, purchaseRippleMat);
purchaseRipple.rotation.x = -Math.PI / 2;
purchaseRipple.position.y = 1.2;
pinGroup.add(purchaseRipple);

/* ─── PURCHASE BADGES ─── */
const floatingBadgeGroup = new THREE.Group();
pinGroup.add(floatingBadgeGroup);

const activePurchaseBadges = [];
let purchaseTexIdx = 0;
let isHeroPurchasesEnabled = false;

function spawnPurchaseBadge() {
  if (!isHeroPurchasesEnabled) return;
  const tex = purchaseTextures[purchaseTexIdx % purchaseTextures.length];
  purchaseTexIdx++;

  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthTest: false }));
  const initialX = (Math.random() - 0.5) * 1.6;
  sprite.position.set(initialX, 1.2, 1.9);
  sprite.scale.set(4.3, 1.36, 1);
  floatingBadgeGroup.add(sprite);

  activePurchaseBadges.push({
    sprite: sprite, progress: 0, speed: 0.0035, baseY: 1.2, baseX: initialX, driftAngle: Math.random() * Math.PI * 2
  });
}
setInterval(spawnPurchaseBadge, 1800);

/* ─── 5 GOLDEN STARS ─── */
const starGroup = new THREE.Group();
pinGroup.add(starGroup);

const starShape = new THREE.Shape();
const pts = 5; const rOut = 0.65; const rIn = 0.3;
for (let i = 0; i < pts * 2; i++) {
  const r = i % 2 === 0 ? rOut : rIn;
  const angle = (i * Math.PI) / pts - Math.PI / 2;
  const x = Math.cos(angle) * r; const y = Math.sin(angle) * r;
  if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
}
starShape.closePath();
const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.06, bevelThickness: 0.06 });
const starMat = new THREE.MeshBasicMaterial({ color: 0xb8ff57 });

const starMeshes = [];
const starTrails = [];
const TRAIL_LENGTH = 16;
for (let i = 0; i < 5; i++) {
  const mesh = new THREE.Mesh(starGeo, starMat);
  mesh.scale.set(1.0, 1.0, 1.0); // Full 1.0 scale: All 5 stars 100% visible!
  starGroup.add(mesh);
  starMeshes.push(mesh);

  const trailGeo = new THREE.BufferGeometry();
  const trailPositions = new Float32Array(TRAIL_LENGTH * 3);
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
  const trailMat = new THREE.PointsMaterial({ color: i % 2 === 0 ? 0xb8ff57 : 0x00d4ff, size: 0.18, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const trailPoints = new THREE.Points(trailGeo, trailMat);
  starGroup.add(trailPoints);
  starTrails.push({ points: trailPoints, history: [] });
}

/* ─── GSAP INTRO TIMELINE ─── */
let isInHeroMode = false;

function triggerSeamlessIntro() {
  isInHeroMode = false;
  isHeroPurchasesEnabled = false;

  gsap.set(pinGroup.position, { x: 0, y: 3.2, z: 0 });
  gsap.set(pinGroup.scale, { x: 0.001, y: 0.001, z: 0.001 });
  gsap.set(lookAtTarget, { x: 0, y: 1.2, z: 0 });
  starMeshes.forEach(s => gsap.set(s.scale, { x: 0.001, y: 0.001, z: 0.001 }));

  gsap.set('#preloader-layer', { opacity: 1, display: 'flex' });
  gsap.set('#splash-title', { opacity: 0, y: 16, filter: 'blur(6px)' });
  gsap.set('#splash-subline', { opacity: 0, y: 10 });
  gsap.set('#splash-progress', { opacity: 0 });
  gsap.set('#splash-progress-line', { width: '0%' });

  
  gsap.set('#hero-left', { opacity: 0, x: -30, filter: 'blur(10px)' });

  const tl = gsap.timeline();
  tl.to(pinGroup.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.8, ease: "elastic.out(1.2, 0.6)" }, 0.1);
  starMeshes.forEach((s, idx) => {
    tl.to(s.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.5, ease: "back.out(2)" }, 0.2 + idx * 0.08);
  });
  tl.to('#splash-title', { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: "power3.out" }, 0.3);
  tl.to('#splash-subline', { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.4);
  tl.to('#splash-progress', { opacity: 1, duration: 0.2 }, 0.3);
  tl.to('#splash-progress-line', { width: '100%', duration: 1.0, ease: "power2.inOut" }, 0.4);

  tl.to('#preloader-layer', { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 1.4);

  // Desktop Golden Ratio Docking (From Center Y:3.2 to Right X:5.2, Y:0.5)
  tl.to(pinGroup.position, { x: 5.2, y: 0.5, z: 0.0, duration: 0.9, ease: "power3.inOut" }, 1.4);
  tl.to(pinGroup.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.9, ease: "power3.inOut" }, 1.4);
  tl.to(lookAtTarget, {
    x: 1.0, y: 0.6, z: 0, duration: 0.9, ease: "power3.inOut",
    onComplete: () => {
      isInHeroMode = true;
      isHeroPurchasesEnabled = true;
    }
  }, 1.4);

  
  tl.to('#hero-left', { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.6, ease: "power3.out" }, 1.6);
}

const raycaster = new THREE.Raycaster();
const mouseVec = new THREE.Vector2();
let isHoveringCircle = false;

window.addEventListener('mousemove', (e) => {
  mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

const clock = new THREE.Clock();
let rippleProgress = 0;

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  raycaster.setFromCamera(mouseVec, camera);
  const intersects = raycaster.intersectObjects([headMesh, shopWalls, winGlass, shopDoor], true);
  
  if (intersects.length > 0 && !isHoveringCircle) {
    isHoveringCircle = true;
    gsap.to(hoverBannerSprite.position, { y: 2.5, duration: 0.45, ease: "back.out(2)" });
    gsap.to(hoverBannerSprite.scale, { x: 4.8, y: 1.2, duration: 0.45, ease: "back.out(2)" });
    gsap.to(hoverBannerSprite.material, { opacity: 1.0, duration: 0.3 });
  } else if (intersects.length === 0 && isHoveringCircle) {
    isHoveringCircle = false;
    gsap.to(hoverBannerSprite.scale, { x: 0.001, y: 0.001, duration: 0.35, ease: "power2.in" });
    gsap.to(hoverBannerSprite.material, { opacity: 0.0, duration: 0.3 });
  }

  const targetCamX = mouseVec.x * 0.8;
  const targetCamY = mouseVec.y * 0.5 + 1.2;
  camera.position.x += (targetCamX - camera.position.x) * 0.04;
  camera.position.y += (targetCamY - camera.position.y) * 0.04;
  camera.lookAt(0.0, 0.0, 0.0);

  pinGroup.rotation.y = time * 0.35;

  if (isHeroPurchasesEnabled) {
    rippleProgress += 0.012;
    if (rippleProgress >= 1.0) rippleProgress = 0;
    const curR = rippleProgress * 5.4;
    purchaseRipple.scale.set(curR, curR, 1);
    purchaseRipple.material.opacity = (1.0 - rippleProgress) * 0.95;
  } else {
    purchaseRipple.material.opacity = 0;
  }

  for (let i = activePurchaseBadges.length - 1; i >= 0; i--) {
    const b = activePurchaseBadges[i];
    b.progress += b.speed;
    b.sprite.position.y = b.baseY + b.progress * 8.5;
    b.sprite.position.x = b.baseX + Math.sin(time * 1.5 + b.driftAngle) * 0.35;
    let alpha = b.progress < 0.1 ? (b.progress / 0.1) : (b.progress > 0.85 ? (1.0 - b.progress) / 0.15 : 1.0);
    b.sprite.material.opacity = Math.max(0, alpha);
    if (b.progress >= 1.0) {
      floatingBadgeGroup.remove(b.sprite);
      activePurchaseBadges.splice(i, 1);
    }
  }

  customerAvatars.forEach(c => {
    c.progress += c.speed;
    if (c.progress >= 1.0) c.progress = 0;
    const curDist = (1.0 - c.progress) * 18.0 + 1.2;
    const curAngle = c.angle + c.progress * 1.2;
    c.sprite.position.x = pinGroup.position.x + Math.cos(curAngle) * curDist;
    c.sprite.position.y = (1.0 - c.progress) * c.startY + c.progress * (pinGroup.position.y + 1.2) + Math.sin(time * 1.2 + c.floatOffset) * 0.25;
    c.sprite.position.z = Math.sin(curAngle) * curDist * 0.35 - 2.0;
    const alpha = c.progress < 0.15 ? (c.progress / 0.15) : (c.progress > 0.85 ? (1.0 - c.progress) / 0.15 : 1.0);
    c.sprite.material.opacity = alpha * 0.85;
  });

  const orbitR = 5.4;
  starMeshes.forEach((star, idx) => {
    const angle = time * 1.0 + (idx * (Math.PI * 2 / 5));
    star.position.set(Math.cos(angle) * orbitR, Math.sin(time * 1.8 + idx) * 0.6, Math.sin(angle) * orbitR);
    star.rotation.y = time * 1.4;

    const trail = starTrails[idx];
    trail.history.unshift({ x: star.position.x, y: star.position.y, z: star.position.z });
    if (trail.history.length > TRAIL_LENGTH) trail.history.pop();
    const posArray = trail.points.geometry.attributes.position.array;
    for (let j = 0; j < TRAIL_LENGTH; j++) {
      if (j < trail.history.length) {
        posArray[j * 3] = trail.history[j].x;
        posArray[j * 3 + 1] = trail.history[j].y;
        posArray[j * 3 + 2] = trail.history[j].z;
      }
    }
    trail.points.geometry.attributes.position.needsUpdate = true;
  });

  halo1.rotation.z = time * 0.15;
  halo2.rotation.y = -time * 0.2;

  renderer.render(scene, camera);
}

animate();
window.addEventListener('load', () => {
  initDirectHeroStage();
});
</script>
</body>
</html>
