<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 76" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyber Cyan to Lime Neon Gradient -->
    <linearGradient id="mbmNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="60%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#b8ff57" />
    </linearGradient>

    <!-- Neon Glow Filter for SVG -->
    <filter id="mbmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. ICON MARK: GEOMETRIC 'M' + LOCATION PIN + UPWARD GROWTH CHEVRON -->
  <g transform="translate(6, 4)" filter="url(#mbmGlow)">
    <!-- Outer 'M' Outer Wings -->
    <path d="M 12 56 L 12 18 L 26 36" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M 58 36 L 72 18 L 72 56" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Map Pin Loop Body -->
    <path d="M 42 66 
             C 31 51 21 41 21 29 
             A 21 21 0 1 1 63 29 
             C 63 41 53 51 42 66 Z" 
          stroke="url(#mbmNeonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Upward Growth Arrow inside Pin -->
    <path d="M 30 42 L 38 33 L 45 40 L 55 24" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Arrowhead Peak -->
    <path d="M 46 23 L 56 23 L 56 33" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 2. TYPOGRAPHY: CLEAN, FULL & CRISPLY READABLE -->
  <g transform="translate(98, 0)">
    <!-- Primary Brand Line -->
    <text x="0" y="39" 
          fill="#ffffff" 
          font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" 
          font-size="23.5" 
          font-weight="800" 
          letter-spacing="0.08em">MARK BISHOP <tspan fill="url(#mbmNeonGrad)">MEDIA</tspan></text>
    
    <!-- Subtitle: Always Clear, Bright & Perfectly Readable -->
    <text x="1" y="61" 
          fill="#00d4ff" 
          font-family="'JetBrains Mono', 'Space Grotesk', monospace" 
          font-size="12.5" 
          font-weight="800" 
          letter-spacing="0.18em"
          opacity="1">LOCAL VISIBILITY OS</text>
  </g>
</svg>
