<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 82" fill="none" width="100%" height="100%">
  <style>
    .logo-sub {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      fill: #00d4ff;
      opacity: 0.75;
    }
    svg:hover .logo-sub {
      fill: #b8ff57;
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(184, 255, 87, 0.9));
    }
  </style>

  <defs>
    <!-- Cyber Cyan to Lime Neon Gradient -->
    <linearGradient id="mbmNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="60%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#b8ff57" />
    </linearGradient>

    <!-- Neon Glow Filter for SVG -->
    <filter id="mbmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. ICON MARK: GEOMETRIC 'M' + LOCATION PIN + UPWARD GROWTH CHEVRON -->
  <g transform="translate(6, 6)" filter="url(#mbmGlow)">
    <!-- Outer 'M' Outer Wings -->
    <path d="M 12 60 L 12 18 L 26 37" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M 60 37 L 74 18 L 74 60" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Map Pin Loop Body -->
    <path d="M 43 70 
             C 32 54 22 43 22 30 
             A 21 21 0 1 1 64 30 
             C 64 43 54 54 43 70 Z" 
          stroke="url(#mbmNeonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Upward Growth Arrow inside Pin -->
    <path d="M 31 44 L 39 35 L 46 42 L 56 25" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Arrowhead Peak -->
    <path d="M 47 24 L 57 24 L 57 34" 
          stroke="url(#mbmNeonGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 2. TYPOGRAPHY: CLEAN, FULL & HORIZONTAL FOR NAVBAR -->
  <g transform="translate(102, 0)">
    <!-- Primary Brand Line (Full & Uncut) -->
    <text x="0" y="42" 
          fill="#ffffff" 
          font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" 
          font-size="24" 
          font-weight="800" 
          letter-spacing="0.08em">MARK BISHOP <tspan fill="url(#mbmNeonGrad)">MEDIA</tspan></text>
    
    <!-- Subtitle: Clean & Pops with Neon Lime Glow on Hover -->
    <text class="logo-sub" x="2" y="65" 
          font-family="'JetBrains Mono', 'Space Grotesk', monospace" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="0.25em">LOCAL VISIBILITY OS</text>
  </g>
</svg>
