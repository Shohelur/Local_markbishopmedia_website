<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 76" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyber Cyan to Lime Neon Gradient -->
    <linearGradient id="mbmNeonGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="60%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#b8ff57" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="mbmGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON MARK: GEOMETRIC 'M' + LOCATION PIN + UPWARD GROWTH CHEVRON -->
  <g transform="translate(0, 4)" filter="url(#mbmGlowIcon)">
    <!-- Outer 'M' Wings -->
    <path d="M 12 56 L 12 18 L 26 36" 
          stroke="url(#mbmNeonGradIcon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M 58 36 L 72 18 L 72 56" 
          stroke="url(#mbmNeonGradIcon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Map Pin Loop Body -->
    <path d="M 42 66 
             C 31 51 21 41 21 29 
             A 21 21 0 1 1 63 29 
             C 63 41 53 51 42 66 Z" 
          stroke="url(#mbmNeonGradIcon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Upward Growth Arrow inside Pin -->
    <path d="M 30 42 L 38 33 L 45 40 L 55 24" 
          stroke="url(#mbmNeonGradIcon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Arrowhead Peak -->
    <path d="M 46 23 L 56 23 L 56 33" 
          stroke="url(#mbmNeonGradIcon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
