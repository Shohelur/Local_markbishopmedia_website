<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyber Cyan to Lime Neon Gradient -->
    <linearGradient id="mbmIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="60%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#b8ff57" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="mbmIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- PURE ICON MARK: GEOMETRIC 'M' + LOCATION PIN + UPWARD GROWTH CHEVRON -->
  <g transform="translate(6, 6)" filter="url(#mbmIconGlow)">
    
    <!-- Outer 'M' Wings -->
    <path d="M 12 62 L 12 20 L 26 38" 
          stroke="url(#mbmIconGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M 60 38 L 74 20 L 74 62" 
          stroke="url(#mbmIconGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Map Pin Loop Body -->
    <path d="M 43 72 
             C 32 56 22 45 22 32 
             A 21 21 0 1 1 64 32 
             C 64 45 54 56 43 72 Z" 
          stroke="url(#mbmIconGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Upward Growth Arrow inside Pin -->
    <path d="M 31 46 L 39 37 L 46 44 L 56 26" 
          stroke="url(#mbmIconGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Arrowhead Peak -->
    <path d="M 47 25 L 57 25 L 57 35" 
          stroke="url(#mbmIconGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
